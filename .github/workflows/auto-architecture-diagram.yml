name: Auto Architecture Diagram

on:
  push:
    paths:
      - 'base-infrastructure/terraform/**/*.tf'
      - 'base-infrastructure/terraform/**/*.tfvars'
      - 'base-infrastructure/terraform/**/*.hcl'
      - '.github/workflows/auto-architecture-diagram.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'base-infrastructure/terraform/**/*.tf'
      - 'base-infrastructure/terraform/**/*.tfvars'
      - 'base-infrastructure/terraform/**/*.hcl'
      - '.github/workflows/auto-architecture-diagram.yml'
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full architecture render (ignore change filtering)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-diagrams:
    uses: suryakumaran2611/auto-arch-diagram/.github/workflows/reusable-auto-arch-diagram.yml@main
    with:
      iac_globs: |
        base-infrastructure/terraform/**/*.tf
        base-infrastructure/terraform/**/*.tfvars
        base-infrastructure/terraform/**/*.hcl
      mode: static
      direction: AUTO
      image_formats: png,jpg,svg
      out_dir: diagrams
      out_md: diagrams/architecture-diagram.md
      out_mmd: diagrams/architecture-diagram.mmd
      out_png: diagrams/architecture-diagram.png
      out_jpg: diagrams/architecture-diagram.jpg
      out_svg: diagrams/architecture-diagram.svg
      comment_on_pr: true
      force_full: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || false }}
